syntax = "proto2";

package starrocks;

option java_package = "com.starrocks.proto";

// CDC Column Value - supports multiple data types to avoid string conversion overhead
message CdcColumnValuePB {
    oneof value {
        bool bool_value = 1;
        int32 int32_value = 2;
        int64 int64_value = 3;
        float float_value = 4;
        double double_value = 5;
        string string_value = 6;
        bytes bytes_value = 7;
        // Add null indicator
        bool is_null = 8;
    }
}

// CDC Row Data - represents a single row with column name -> value mappings
message CdcRowDataPB {
    // Map from column name to column value
    map<string, CdcColumnValuePB> columns = 1;
}

// CDC Operation Data - represents a batch of rows for an operation type
message CdcOperationDataPB {
    // Operation type: "u" for update, "d" for delete
    optional string operation_type = 1;
    // Batch of rows affected by this operation
    repeated CdcRowDataPB rows = 2;
}

// CDC Transaction Data - represents all CDC data for a single transaction
message CdcTransactionDataPB {
    // Tablet ID
    optional int64 tablet_id = 1;
    // Transaction ID
    optional int64 txn_id = 2;
    // Version
    optional int64 version = 3;
    // All operations in this transaction
    repeated CdcOperationDataPB operations = 4;
    // Metadata for pagination/streaming
    optional int64 page_number = 5;
    optional int64 total_pages = 6;
    optional int64 total_rows = 7;
    optional int64 rows_in_page = 8;
    // Timestamp when this data was collected
    optional int64 timestamp = 9;
}

